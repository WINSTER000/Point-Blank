{% extends 'includes/base.html' %}
{% block pageTitle %}{{ username }}'s Profile{% endblock %}
{% block content %}
<div class="page">
    <!-- Header -->
    <div class="profile-header">
        <div class="container">
            <div class="profile-header-content">
                <div class="profile-avatar">
                    <svg class="avatar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                </div>
                <div class="profile-header-info">
                    <h1 class="profile-name" id="profileName">{{ client.user_first_name }} {{ client.user_last_name }}</h1>
                    <p class="profile-email" id="profileEmail">{{ client.user_email }}</p>
                </div>
                <button class="btn btn-outline" onclick="window.location.href='logout'">
                    <svg class="icon-small" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                    LOGOUT
                </button>
            </div>
        </div>
    </div>

    <!-- Profile Content -->
    <div class="container profile-container">
        <!-- Main Content Area -->
        <div class="profile-content">
            <!-- Account Info Tab -->
            <div id="accountTab" class="profile-tab active">
                <div class="profile-section">
                    <div class="profile-section-header">
                        <h2>Client's Information</h2>
                        <button class="btn btn-primary" onclick="window.location.href='delete_account'" id="deleteBtn">
                            <svg class="icon-small" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                            </svg>
                            Delete Account
                        </button>
                    </div>

                    <form id="profileForm" class="profile-form">
                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label">First Name</label>
                                <input type="text" id="firstName" class="form-input" placeholder="{{ client.user_first_name }}" disabled>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Last Name</label>
                                <input type="text" id="lastName" class="form-input" placeholder="{{ client.user_last_name }}" disabled>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Email Address</label>
                            <input type="email" id="email" class="form-input" placeholder="{{ client.user_email }}" disabled>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" id="phone" class="form-input" placeholder="{{ client.user_phone_number }}" disabled>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Date of Birth</label>
                            <input type="text" id="dateOfBirth" class="form-input" placeholder="{{ client.user_date_of_birth|date:'d M Y' }}" disabled>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extraJS %}
    <script>
        document.getElementById("deleteBtn").addEventListener("submit", function (e) {
            e.preventDefault();

            Swal.fire({
                title: "Success",
                text: "Account has been deleted successfully!",
                icon: "success",
                showConfirmButton: true
            }).then(() => {
                this.submit();
            });
        });
    </script>
{% endblock %}
